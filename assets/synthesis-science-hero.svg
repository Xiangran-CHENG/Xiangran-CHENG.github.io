<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc">
  <title id="title">Observe, model and guide material formation</title>
  <desc id="desc">A schematic research workflow. Controlled temperature history influences reacting precursor particles and intermediate interfaces, with branching pathways to a target phase or competing phases. Time-resolved diffraction observations constrain an AI and physics model of phase evolution. Model predictions guide new synthesis conditions. Curves, particles and observations are illustrative, not measured results.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="#91a5b5" stroke-width="1.5"/></marker>
    <marker id="gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#ecb64f" stroke-width="1.5"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#7acde2" stroke-width="1.5"/></marker>
    <pattern id="a-atoms" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="3.5" fill="#87bfd3"/></pattern>
    <pattern id="b-atoms" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="3.5" fill="#63c6cb"/></pattern>
    <pattern id="target-atoms" x="0" y="0" width="23" height="23" patternUnits="userSpaceOnUse"><path d="M0 11.5H23M11.5 0V23" stroke="#92743b" stroke-width="1"/><circle cx="11.5" cy="11.5" r="4" fill="#f2c767"/></pattern>
    <pattern id="competing-atoms" x="0" y="0" width="24" height="21" patternUnits="userSpaceOnUse"><path d="M0 0 12 21 24 0" fill="none" stroke="#737e89" stroke-width="1"/><circle cx="0" cy="0" r="3" fill="#bbc4cc"/><circle cx="12" cy="21" r="3" fill="#bbc4cc"/></pattern>
    <linearGradient id="peak" x1="0" x2="1"><stop stop-color="#7acde2" stop-opacity="0"/><stop offset=".5" stop-color="#a5e9f0"/><stop offset="1" stop-color="#7acde2" stop-opacity="0"/></linearGradient>
    <style>
      text{font-family:"Segoe UI",Arial,sans-serif;fill:#e9f0f4;font-size:28px}
      .muted{fill:#aebdc7}.small{font-size:26px}.label{font-size:30px;font-weight:600}.axis{fill:none;stroke:#81909c;stroke-width:2}
      .flow{fill:none;stroke:#91a5b5;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .blue-flow{stroke:#7acde2;marker-end:url(#blue-arrow)}.gold-flow{stroke:#ecb64f;marker-end:url(#gold-arrow)}
      .panel{fill:#121c25;stroke:#344552;stroke-width:1.5}.grid{stroke:#293a46;stroke-width:1}
    </style>
  </defs>
  <rect width="1100" height="850" rx="12" fill="#0e141b"/>

  <!-- Conditions are experimental controls; the line is a schematic thermal program. -->
  <text x="48" y="51" class="label">Synthesis conditions</text>
  <text x="76" y="139" class="muted small">Temperature</text>
  <path d="M310 87V185H881" class="axis"/>
  <path d="M326 167H420L526 109H701L797 151H858" fill="none" stroke="#7acde2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="526" cy="109" r="6" fill="#0e141b" stroke="#7acde2" stroke-width="3"/>
  <text x="740" y="218" text-anchor="middle" class="muted small">Time</text>
  <path d="M600 198V294" class="flow blue-flow"/>
  <text x="618" y="260" class="small muted">Control formation</text>

  <!-- Particle cross sections show precursor contact and a growing interfacial product. -->
  <g aria-label="Contacting precursor particles">
    <circle cx="116" cy="340" r="53" fill="#234354" stroke="#7fb8d0" stroke-width="3"/>
    <circle cx="116" cy="340" r="51" fill="url(#a-atoms)"/>
    <circle cx="190" cy="340" r="48" fill="#20515b" stroke="#74ccd1" stroke-width="3"/>
    <circle cx="190" cy="340" r="46" fill="url(#b-atoms)"/>
  </g>
  <text x="149" y="433" text-anchor="middle" class="label">Precursors</text>
  <path d="M258 340H333" class="flow"/>

  <g aria-label="Intermediate material with a reaction layer at a particle interface">
    <circle cx="408" cy="340" r="57" fill="#234354" stroke="#7fb8d0" stroke-width="3"/>
    <circle cx="408" cy="340" r="54" fill="url(#a-atoms)"/>
    <circle cx="480" cy="340" r="52" fill="#20515b" stroke="#74ccd1" stroke-width="3"/>
    <circle cx="480" cy="340" r="49" fill="url(#b-atoms)"/>
    <path d="M439 293C423 314 423 366 439 387C457 371 463 314 449 293Z" fill="#88dce0" stroke="#c3f0ee" stroke-width="2"/>
    <path d="M439 300C433 324 433 355 439 379" fill="none" stroke="#3e8e99" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M386 342H412M493 342H471" stroke="#b9e5ec" stroke-width="2" fill="none"/>
    <path d="M405 337 413 342 405 347M478 337 470 342 478 347" fill="none" stroke="#b9e5ec" stroke-width="2"/>
  </g>
  <text x="444" y="433" text-anchor="middle" class="label">Intermediates</text>
  <text x="444" y="465" text-anchor="middle" class="muted small">Evolving interfaces</text>

  <!-- These branches express competing outcomes, not quantitative reaction rates. -->
  <path d="M553 340H626" class="flow"/>
  <circle cx="644" cy="340" r="5" fill="#c1cdd5"/>
  <path d="M653 338C716 338 745 310 816 310" class="flow gold-flow"/>
  <path d="M653 349C705 363 746 463 822 463" class="flow"/>
  <g aria-label="Target phase">
    <circle cx="894" cy="310" r="58" fill="#44351c" stroke="#ecb64f" stroke-width="3"/>
    <circle cx="894" cy="310" r="54" fill="url(#target-atoms)"/>
  </g>
  <text x="894" y="230" text-anchor="middle" class="label" style="fill:#f2c767">Target phase</text>
  <g aria-label="Competing phase">
    <circle cx="894" cy="458" r="40" fill="#28333d" stroke="#939fac" stroke-width="3"/>
    <circle cx="894" cy="458" r="37" fill="url(#competing-atoms)"/>
  </g>
  <text x="894" y="536" text-anchor="middle" class="muted">Competing phases</text>

  <circle cx="300" cy="340" r="4" fill="#7acde2"/>
  <path d="M300 351V492H212V558" class="flow blue-flow"/>
  <text x="230" y="537" class="small muted">Observe</text>
  <path d="M706 559V449" class="flow blue-flow"/>
  <text x="687" y="535" text-anchor="end" class="small muted">Predict</text>

  <!-- The two lower panels are schematic observables and model outputs. -->
  <rect x="48" y="579" width="437" height="235" rx="8" class="panel"/>
  <text x="73" y="620" class="label">Observations</text>
  <path d="M130 642V754" class="axis" marker-end="url(#arrow)"/>
  <path d="M130 760H456" class="axis"/>
  <text x="98" y="705" transform="rotate(-90 98 705)" text-anchor="middle" class="small muted">Time</text>
  <text x="454" y="790" text-anchor="end" class="small muted">q</text>
  <g aria-label="Schematic diffraction intensity at successive times">
    <path d="M139 652H449M139 666H449M139 680H449M139 694H449M139 708H449M139 722H449M139 736H449M139 750H449" stroke="#243844" stroke-width="11"/>
    <g fill="url(#peak)">
      <path d="M161 646h18v11h-18zM213 646h16v11h-16z" opacity=".96"/><path d="M161 660h18v11h-18zM213 660h16v11h-16z" opacity=".86"/>
      <path d="M161 674h18v11h-18zM213 674h16v11h-16z" opacity=".68"/><path d="M161 688h18v11h-18zM213 688h16v11h-16z" opacity=".45"/>
      <path d="M161 702h18v11h-18zM213 702h16v11h-16z" opacity=".26"/><path d="M161 716h18v11h-18zM213 716h16v11h-16z" opacity=".10"/>
      <path d="M271 660h17v11h-17zM325 660h14v11h-14z" opacity=".12"/><path d="M271 674h17v11h-17zM325 674h14v11h-14z" opacity=".46"/>
      <path d="M271 688h17v11h-17zM325 688h14v11h-14z" opacity=".94"/><path d="M271 702h17v11h-17zM325 702h14v11h-14z" opacity=".76"/>
      <path d="M271 716h17v11h-17zM325 716h14v11h-14z" opacity=".32"/><path d="M271 730h17v11h-17zM325 730h14v11h-14z" opacity=".10"/>
      <path d="M374 688h16v11h-16zM418 688h16v11h-16z" opacity=".12"/><path d="M374 702h16v11h-16zM418 702h16v11h-16z" opacity=".34"/>
      <path d="M374 716h16v11h-16zM418 716h16v11h-16z" opacity=".60"/><path d="M374 730h16v11h-16zM418 730h16v11h-16z" opacity=".84"/>
      <path d="M374 744h16v11h-16zM418 744h16v11h-16z" opacity="1"/>
    </g>
  </g>
  <text x="73" y="795" class="small muted">Time-resolved diffraction</text>

  <text x="550" y="659" text-anchor="middle" class="small muted">Constrain</text>
  <text x="550" y="690" text-anchor="middle" class="small muted">model</text>
  <path d="M499 713H599" class="flow blue-flow"/>

  <rect x="615" y="579" width="437" height="235" rx="8" class="panel"/>
  <text x="640" y="620" class="label">AI + physics</text>
  <text x="640" y="654" class="small muted">Target fraction</text>
  <path d="M690 666V758H1018" class="axis"/>
  <path d="M690 685H1018M690 722H1018" class="grid"/>
  <path d="M706 748C746 748 758 742 784 725S824 682 858 679S939 675 1004 675" fill="none" stroke="#ecb64f" stroke-width="3.5"/>
  <g fill="#121c25" stroke="#f1cd81" stroke-width="2.5">
    <circle cx="722" cy="744" r="5"/><circle cx="766" cy="739" r="5"/><circle cx="807" cy="700" r="5"/><circle cx="851" cy="685" r="5"/><circle cx="907" cy="671" r="5"/><circle cx="973" cy="679" r="5"/>
  </g>
  <text x="1018" y="780" text-anchor="end" class="small muted">Time</text>
  <path d="M640 797H672" stroke="#ecb64f" stroke-width="3"/><text x="680" y="805" class="small muted">Model</text>
  <circle cx="786" cy="797" r="5" fill="#121c25" stroke="#f1cd81" stroke-width="2.5"/><text x="800" y="805" class="small muted">Observations</text>

  <!-- Dashed feedback denotes a research decision, not a physical transport path. -->
  <path d="M1054 638H1074V96H820V131" class="flow blue-flow" stroke-dasharray="7 7"/>
  <text x="990" y="40" text-anchor="middle" class="small muted">Choose next</text>
  <text x="990" y="72" text-anchor="middle" class="small muted">conditions</text>
  <text x="550" y="843" text-anchor="middle" class="small muted">Schematic workflow · illustrative data</text>
</svg>
